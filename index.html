<style>
:root{color-scheme:light;--paper:#fff;--ink:#323b2c;--muted:#687064;--line:#edf0e9;--accent:#58713d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8faf5 0,#fff 440px);color:var(--ink);font:14px/1.5 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}main{max-width:1180px;margin:auto;padding:22px 40px 30px}header{text-align:center;margin-bottom:65px}h1{margin:0;line-height:0}.logo{width:230px;height:230px;object-fit:contain}nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:8px}nav a{display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border:1px solid #e5eadf;border-radius:999px;background:#ffffffb3;font-size:12px;text-decoration:none;transition:background .2s,box-shadow .2s,transform .2s}nav svg{width:17px;height:17px;flex-shrink:0}nav a:hover{background:#fff;box-shadow:0 5px 18px #30421b12;transform:translateY(-2px)}a{color:inherit}a:focus-visible{outline:2px solid var(--accent);outline-offset:7px;border-radius:3px}.books{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:30px}.book{text-decoration:none;display:flex;flex-direction:column;align-items:flex-start}.cover{width:100%;aspect-ratio:298/385;display:flex;align-items:flex-end;justify-content:center;margin-bottom:25px;perspective:900px}.cover img{display:block;max-width:100%;width:100%;height:auto;max-height:100%;object-fit:contain;border-radius:2px 4px 4px 2px;box-shadow:2px 3px 5px #24301912,5px 13px 22px -9px #26341d3b;transition:transform .32s cubic-bezier(.2,.7,.3,1),box-shadow .32s}.book:hover .cover img,.book:focus-visible .cover img{transform:translateY(-9px) rotate(-1deg);box-shadow:3px 5px 9px #24301912,8px 24px 32px -10px #26341d4d}h2{font:normal 19px/1.35 Georgia,serif;letter-spacing:-.3px;margin:0 0 7px}.edition{font-size:11px;color:var(--muted);margin:0 0 17px}.amazon{display:inline-flex;align-items:center;gap:8px;font-size:11px;color:var(--accent);margin-top:auto;padding-bottom:3px;border-bottom:1px solid #d9e2d0;transition:border-color .2s}.amazon:after{content:'\2192';transition:transform .2s}.book:hover .amazon{border-color:var(--accent)}.book:hover .amazon:after{transform:translateX(3px)}footer{text-align:center;border-top:1px solid var(--line);margin-top:65px;padding-top:24px;font-size:10px;letter-spacing:.5px;color:var(--muted)}@media(max-width:900px){.books{grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 28px}main{max-width:760px}header{margin-bottom:45px}}@media(max-width:500px){main{padding:12px 25px 25px}.logo{width:195px;height:195px}nav{gap:8px;margin-top:0}nav a{padding:9px 12px;font-size:11px;gap:7px}nav svg{width:15px;height:15px}header{margin-bottom:42px}.books{grid-template-columns:repeat(2,minmax(0,1fr));gap:35px 24px}.cover{margin-bottom:20px}h2{font-size:18px}footer{margin-top:45px}}@media(prefers-reduced-motion:reduce){*,*:after{transition:none!important}.book:hover .cover img,.book:focus-visible .cover img,nav a:hover{transform:none}}
</style>
</head>
