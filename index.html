<style>
:root{color-scheme:light;--paper:#f7f5ef;--ink:#292e27;--muted:#73756d;--line:#deded5;--accent:#a34b35}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}main{max-width:1080px;margin:auto;padding:64px 32px 32px}header{text-align:center;margin-bottom:55px}h1{font:normal 44px/1 Georgia,serif;letter-spacing:-2px;margin:0 0 22px}h1 span{color:var(--accent)}nav{display:flex;justify-content:center;gap:25px;flex-wrap:wrap}nav a{font-size:12px;text-underline-offset:5px;text-decoration-color:var(--line)}a{color:inherit}a:hover{color:var(--accent)}a:focus-visible{outline:2px solid var(--accent);outline-offset:6px}.books{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:25px}.book{text-decoration:none;display:block}.cover{aspect-ratio:2/3;background:#eeece4;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:0;margin-bottom:15px;transition:transform .2s}.cover img{display:block;width:100%;height:100%;object-fit:contain}.book:hover .cover{transform:translateY(-4px)}h2{font:normal 18px/1.3 Georgia,serif;margin:0 0 6px}.edition{font-size:11px;color:var(--muted);margin:0 0 12px}.amazon{font-size:11px;text-decoration:underline;text-underline-offset:4px}footer{text-align:center;border-top:1px solid var(--line);margin-top:55px;padding-top:22px;font-size:10px;color:var(--muted)}@media(max-width:800px){.books{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 22px}}@media(max-width:500px){main{padding:40px 24px 24px}header{margin-bottom:38px}h1{font-size:39px}.books{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 20px}h2{font-size:17px}footer{margin-top:40px}}@media(prefers-reduced-motion:reduce){.cover{transition:none}}
</style>
</head>
